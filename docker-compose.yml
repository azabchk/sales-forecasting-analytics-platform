services:
  postgres:
    image: postgres:16
    container_name: rossmann_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rossmann}
      POSTGRES_USER: ${POSTGRES_USER:-rossmann_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_views_kpi.sql:/docker-entrypoint-initdb.d/02_views_kpi.sql:ro
      - ./sql/03_indexes.sql:/docker-entrypoint-initdb.d/03_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rossmann_user} -d ${POSTGRES_DB:-rossmann}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
